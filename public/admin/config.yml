backend:
  name: git-gateway
  branch: master

# Media upload folder
media_folder: "public/images/events"
public_folder: "/images/events"

collections:
  # 1. Events Management
  - name: "events_collection"
    label: "Events Management"
    files:
      - name: "events_list"
        label: "Events List"
        file: "public/config/events.json"
        format: "json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} ({{fields.date}})"
            fields:
              - { label: "Event Title", name: "title", widget: "string" }
              - { label: "Date (YYYY-MM-DD)", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Time (e.g. 11:00 AM - 6:00 PM)", name: "time", widget: "string", required: false }
              - { label: "Location / Venue Address", name: "location", widget: "string", required: false }
              - { label: "Short Summary", name: "description", widget: "text" }
              - { label: "Full Details & Description", name: "details", widget: "text", required: false }
              - { label: "Event Poster Image", name: "image", widget: "image", required: false }
              - { label: "Is Registration Open?", name: "isOpen", widget: "boolean", default: true }
              - { label: "Show on Homepage as Featured / Upcoming?", name: "upcomingEvent", widget: "boolean", default: false }
              - { label: "Zeffy Ticket Form Embed URL", name: "formIframe", widget: "string", required: false }
              - { label: "Google Map Embed URL", name: "performanceIframe", widget: "string", required: false }

  # 2. WhatsApp & Social Links Management
  - name: "links_collection"
    label: "WhatsApp & Social Links"
    files:
      - name: "social_media_links"
        label: "Community Channels (WhatsApp, Facebook, Instagram)"
        file: "public/config/socialmedialinks.json"
        format: "json"
        fields:
          - label: "Quick Action Cards"
            name: "cardData"
            widget: "list"
            summary: "{{fields.title}} ({{fields.link}})"
            fields:
              - { label: "Card Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "URL / Group Invite Link", name: "link", widget: "string" }
              - { label: "Icon (FaWhatsapp, FaFacebook, FaFileDownload)", name: "icon", widget: "string" }
              - { label: "Card Color (Hex code)", name: "color", widget: "string" }

          - label: "Social Footer & Contact Links"
            name: "socialLinks"
            widget: "list"
            summary: "{{fields.platform}}: {{fields.url}}"
            fields:
              - { label: "Platform Name", name: "platform", widget: "string" }
              - { label: "Page / Group Link", name: "url", widget: "string" }
              - { label: "Icon Name (WhatsApp, Facebook, Instagram, Email)", name: "icon", widget: "string" }
              - { label: "Brand Color (Hex code)", name: "color", widget: "string" }

  # 3. Community Photo Gallery Management
  - name: "gallery_collection"
    label: "Photo Gallery"
    files:
      - name: "gallery_list"
        label: "Community Photos"
        file: "public/config/gallery.json"
        format: "json"
        fields:
          - label: "Photos"
            name: "images"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Caption / Festival Title", name: "title", widget: "string", required: false }
